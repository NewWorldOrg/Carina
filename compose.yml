services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /code
    volumes:
      - .:/code
      - nuget:/root/.nuget/packages
      - driver-run:/run/carina
    tty: true
    ports:
      - ${API_PORT:-8081}:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_hostBuilder__reloadConfigOnChange: 'false'
      ConnectionStrings__Carina: Host=db;Port=5432;Database=carina;Username=carina;Password=${POSTGRES_PASSWORD:-carina}
      CARINA_DB_CONNECTION: Host=db;Port=5432;Database=carina;Username=carina;Password=${POSTGRES_PASSWORD:-carina}
      CARINA_DRIVER_SOCKET: /run/carina/driver.sock
      CARINA_KNOWN_NETWORKS: ${CARINA_KNOWN_NETWORKS:-172.16.0.0/12}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - carina-api
      carina-web:
        aliases:
          - carina-api

  proxy:
    image: nginx:1.29-alpine
    ports:
      - ${PROXY_PORT:-8080}:8080
    volumes:
      - ./docker/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      NGINX_ENVSUBST_FILTER: ^CARINA_
      CARINA_APP_ORIGIN: ${CARINA_APP_ORIGIN:-http://carina-api:8080}
      CARINA_WEB_ORIGIN: ${CARINA_WEB_ORIGIN:-http://web:3000}
    networks:
      - default
      - carina-web
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - app

  driver:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /code
    command: ['bash', 'docker/driver.dev.sh']
    restart: unless-stopped
    volumes:
      - .:/code
      - nuget:/root/.nuget/packages
      - driver-run:/run/carina
      - recordings:/srv/recordings
      - driver-build:/driver
    stop_grace_period: 7h
    environment:
      CARINA_DRIVER_CONFIG: /code/docker/driver.development.json
      DOTNET_hostBuilder__reloadConfigOnChange: 'false'
      ASPNETCORE_HTTP_PORTS: ''
      ASPNETCORE_HTTPS_PORTS: ''

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: carina
      POSTGRES_USER: carina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carina}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carina -d carina']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  default:
  carina-web:
    external: true

volumes:
  nuget:
  driver-run:
  driver-build:
  recordings:
  pgdata:
