services:
  app:
    build:
      context: .
      target: develop
    working_dir: /code
    volumes:
      - .:/code
      - nuget:/root/.nuget/packages
      - driver-run:/run/carina
      - recordings:/srv/recordings:ro
      - thumbnails:/srv/thumbnails
      - encodes:/srv/encodes
    devices:
      - ${CARINA_DRI:-/dev/null}:${CARINA_DRI:-/dev/null}
    group_add:
      - '${CARINA_DRI_VIDEO_GID:-0}'
      - '${CARINA_DRI_RENDER_GID:-65534}'
    tty: true
    ports:
      - ${API_PORT:-8081}:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_hostBuilder__reloadConfigOnChange: 'false'
      ConnectionStrings__Carina: Host=db;Port=5432;Database=carina;Username=carina;Password=${POSTGRES_PASSWORD:-carina}
      CARINA_DB_CONNECTION: Host=db;Port=5432;Database=carina;Username=carina;Password=${POSTGRES_PASSWORD:-carina}
      CARINA_DRIVER_SOCKET: /run/carina/driver.sock
      CARINA_KNOWN_NETWORKS: ${CARINA_KNOWN_NETWORKS:-172.16.0.0/12}
      CARINA_PUBLIC_ORIGIN: ${CARINA_PUBLIC_ORIGIN:-}
      CARINA_ANONYMOUS_NETWORKS: ${CARINA_ANONYMOUS_NETWORKS:-}
      Integrity__OutputRoots: primary=/srv/recordings
      Thumbnails__WrittenTo: /srv/thumbnails
      Encodings__OutputRoots: encodes=/srv/encodes
      Transcoding__Prefer: ${CARINA_TRANSCODING_PREFER:-Software}
    depends_on:
      db:
        condition: service_healthy

  driver:
    build:
      context: .
      target: driver-develop
    working_dir: /code
    command: ['bash', 'docker/driver.dev.sh']
    restart: unless-stopped
    volumes:
      - .:/code
      - nuget:/root/.nuget/packages
      - driver-run:/run/carina
      - recordings:/srv/recordings
      - driver-build:/driver
      - /run/pcscd:/run/pcscd:ro
    stop_grace_period: 7h
    environment:
      CARINA_DRIVER_CONFIG: /code/docker/driver.development.json
      DOTNET_hostBuilder__reloadConfigOnChange: 'false'
      ASPNETCORE_HTTP_PORTS: ''
      ASPNETCORE_HTTPS_PORTS: ''

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: carina
      POSTGRES_USER: carina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carina}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carina -d carina']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nuget:
  driver-run:
  driver-build:
  recordings:
  thumbnails:
  encodes:
  pgdata:
