x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  app:
    logging: *logging
    build:
      context: .
      target: develop
    working_dir: /code
    volumes:
      - .:/code
      - nuget:/root/.nuget/packages
      - driver-run:/run/carina
      - ${CARINA_RECORDINGS_DIR:-recordings}:/srv/recordings:ro
      - thumbnails:/srv/thumbnails
      - captions:/srv/captions
      - ${CARINA_ENCODES_DIR:-encodes}:/srv/encodes
      - ${CARINA_KEYS_DIR:-data-protection-keys}:/var/lib/carina/keys
      - ${CARINA_LEARNING_IMPORT_DIR:-learning-import}:/srv/learning-import:ro
    devices:
      - ${CARINA_DRI:-/dev/null}:${CARINA_DRI:-/dev/null}
    group_add:
      - '${CARINA_DRI_VIDEO_GID:-0}'
      - '${CARINA_DRI_RENDER_GID:-65534}'
    tty: true
    ports:
      - ${API_PORT:-8081}:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_hostBuilder__reloadConfigOnChange: 'false'
      ConnectionStrings__Carina: Host=db;Port=5432;Database=carina;Username=carina;Password=${POSTGRES_PASSWORD:-carina}
      CARINA_DB_CONNECTION: Host=db;Port=5432;Database=carina;Username=carina;Password=${POSTGRES_PASSWORD:-carina}
      CARINA_DRIVER_SOCKET: /run/carina/driver.sock
      CARINA_DATA_PROTECTION_KEYS: /var/lib/carina/keys
      CARINA_KNOWN_NETWORKS: ${CARINA_KNOWN_NETWORKS:-172.16.0.0/12}
      CARINA_PUBLIC_ORIGIN: ${CARINA_PUBLIC_ORIGIN:-}
      CARINA_ANONYMOUS_NETWORKS: ${CARINA_ANONYMOUS_NETWORKS:-}
      Integrity__OutputRoots: primary=/srv/recordings
      Thumbnails__WrittenTo: /srv/thumbnails
      Captions__WrittenTo: /srv/captions
      Learning__ImportFrom: /srv/learning-import
      Encodings__OutputRoots: encodes=/srv/encodes
      Encodings__Prefer: ${CARINA_ENCODINGS_PREFER:-Software}
      Transcoding__Prefer: ${CARINA_TRANSCODING_PREFER:-Software}
      Machine__RenderNode: ${CARINA_RENDER_NODE:-/dev/dri/renderD128}
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--output', '/dev/null', 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  driver:
    logging: *logging
    image: ghcr.io/newworldorg/puppis:sha-e2c89245801f
    restart: unless-stopped
    configs:
      - source: driver
        target: /etc/puppis/driver.json
    volumes:
      - driver-run:/run/carina
      - ${CARINA_RECORDINGS_DIR:-recordings}:/srv/recordings
      # pcscd replaces the socket inside this directory whenever it restarts, so bind the directory: a bind mount of the socket file would go on pointing at the one that is gone.
      - /run/pcscd:/run/pcscd:ro
    stop_grace_period: 7h
    healthcheck:
      test: ['CMD', '/opt/puppis/Puppis.Driver', '--probe']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 5m
      start_interval: 10s
    environment:
      CARINA_DRIVER_CONFIG: /etc/puppis/driver.json

  db:
    logging: *logging
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: carina
      POSTGRES_USER: carina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carina}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carina -d carina']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nuget:
  driver-run:
  recordings:
  thumbnails:
  captions:
  encodes:
  data-protection-keys:
  learning-import:
  pgdata:

configs:
  driver:
    content: |
      {
        "socketPath": "/run/carina/driver.sock",
        "socketGroupId": 10001,
        "outputRoots": [{ "name": "primary", "path": "/srv/recordings" }],
        "shutdownGraceHours": 6,
        "liveSessionMinutes": 240,
        "tuner": {
          "backend": "fake",
          "signalQualitySeconds": 10,
          "demuxBufferBytes": 16777216
        },
        "devices": [
          { "id": "fake-terrestrial", "kind": "terrestrial", "enabled": true },
          { "id": "fake-satellite", "kind": "satellite", "enabled": true }
        ]
      }
