name: carina-deploy

services:
  driver:
    image: ${CARINA_IMAGE:-carina}
    environment:
      CARINA_ROLE: driver
      CARINA_DRIVER_CONFIG: /etc/carina/driver.json
    volumes:
      - ${CARINA_DRIVER_CONFIG_FILE:?set it to the driver configuration this deployment runs; docker/driver.development.json is the synthetic-tuner one and records no broadcast}:/etc/carina/driver.json:ro
      - driver-run:/run/carina
      - recordings:/srv/recordings
    stop_grace_period: ${CARINA_STOP_GRACE:?set it from the driver's own budget - "docker/grace-period.sh derive" prints the value, "task deploy:up" applies it}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/opt/carina/driver/Carina.Driver', '--probe']
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s

  migrate:
    image: ${CARINA_IMAGE:-carina}
    user: ${CARINA_UID:-10001}:${CARINA_GID:-10001}
    environment:
      CARINA_ROLE: migrate
      ConnectionStrings__Carina: Host=db;Port=5432;Database=carina;Username=carina;Password=${POSTGRES_PASSWORD:?set the database password; committed configuration carries no working default}
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${CARINA_IMAGE:-carina}
    user: ${CARINA_UID:-10001}:${CARINA_GID:-10001}
    environment:
      CARINA_ROLE: app
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Carina: Host=db;Port=5432;Database=carina;Username=carina;Password=${POSTGRES_PASSWORD:?set the database password; committed configuration carries no working default}
      CARINA_DRIVER_SOCKET: /run/carina/driver.sock
    volumes:
      - driver-run:/run/carina
    ports:
      - ${CARINA_API_PORT:-8082}:8080
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; head -1 <&3 | grep -q " 200 "',
        ]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: carina
      POSTGRES_USER: carina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set the database password; committed configuration carries no working default}
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carina -d carina']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  driver-run:
  recordings:
  pgdata:
