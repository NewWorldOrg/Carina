apiVersion: apps/v1
kind: Deployment
metadata:
  name: carina-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: carina
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carina
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: app
          image: carina:latest
          args: ['app']
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://0.0.0.0:8080
            - name: CARINA_KNOWN_NETWORKS
              value: 10.0.0.0/8
            - name: CARINA_DRIVER_SOCKET
              value: /run/carina/driver.sock
            - name: ConnectionStrings__Carina
              valueFrom:
                secretKeyRef:
                  name: carina-database
                  key: connection-string
          volumeMounts:
            - name: driver-run
              mountPath: /run/carina
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
      volumes:
        - name: driver-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: carina-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: carina
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 8080
      targetPort: http
