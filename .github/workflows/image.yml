name: Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: The image, with the licenses it carries checked as it is built
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: carina:built
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose config --quiet
      - name: A prerelease never takes latest, and latest names the newest release that is not one
        run: .github/release-latest.sh prove

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: The tag is named for this commit
        run: echo "REFERENCE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}" >> "${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: A tag that is already there is left as it is
        id: tag
        run: |
          there="$(.github/publish-image.sh "${REFERENCE}" there)"
          echo "there=${there}" >> "${GITHUB_OUTPUT}"
      - if: steps.tag.outputs.there == 'no'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: carina:built
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          load: true
          cache-from: type=gha
      - name: The image goes out under the tag of this commit
        if: steps.tag.outputs.there == 'no'
        run: .github/publish-image.sh "${REFERENCE}" push carina:built
