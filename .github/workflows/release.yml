name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag names the version Directory.Build.props declares
        run: |
          declared="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          if [ "${GITHUB_REF_NAME}" != "v${declared}" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not v${declared}, the version Directory.Build.props declares" >&2
            exit 1
          fi
      - name: The two tags this commit was published under
        id: tags
        run: |
          set -o pipefail
          .github/image-tags.sh tags | tee -a "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The release names the images master already published, and nothing is built
        run: |
          .github/release-image.sh "ghcr.io/${GITHUB_REPOSITORY,,}" "${{ steps.tags.outputs.driver }}" "${GITHUB_REF_NAME}" driver-
          .github/release-image.sh "ghcr.io/${GITHUB_REPOSITORY,,}" "${{ steps.tags.outputs.app }}" "${GITHUB_REF_NAME}" app-
