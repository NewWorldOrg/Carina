name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet test --no-restore --filter "Category!=DbIntegration"

  openapi:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Carina: Host=db;Port=5432;Database=carina;Username=carina;Password=placeholder
      CARINA_DRIVER_SOCKET: /run/carina/driver.sock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build src/Carina.Api --no-restore -warnaserror
      - name: Delete the document so the check below cannot pass without generating it
        run: rm openapi/Carina.Api.json
      - name: Generate the document, which starts the host and so needs the settings present
        run: dotnet msbuild src/Carina.Api/Carina.Api.csproj -t:GenerateOpenApiDocuments
      - name: The checked-in document is the generated one
        run: git diff --exit-code openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/Carina.Api.json

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet format --no-restore --verify-no-changes

  compose:
    runs-on: ubuntu-latest
    env:
      CARINA_DRIVER_CONFIG_FILE: ./docker/driver.development.json
      CARINA_STOP_GRACE: 7h
      POSTGRES_PASSWORD: ci-only-not-a-deployment
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.deploy.yml config --quiet
      - name: An unset database password stops the deployment file, naming itself
        run: |
          if output="$(docker compose -f compose.deploy.yml config --quiet 2>&1)"; then
            echo "the deployment file rendered without POSTGRES_PASSWORD" >&2
            exit 1
          fi
          if ! grep -q 'POSTGRES_PASSWORD' <<<"${output}"; then
            echo "it failed for another reason: ${output}" >&2
            exit 1
          fi
          echo "${output}"
        env:
          POSTGRES_PASSWORD: ''
      - name: An unset driver configuration stops the deployment file, naming itself
        run: |
          if output="$(docker compose -f compose.deploy.yml config --quiet 2>&1)"; then
            echo "the deployment file rendered without CARINA_DRIVER_CONFIG_FILE" >&2
            exit 1
          fi
          if ! grep -q 'CARINA_DRIVER_CONFIG_FILE' <<<"${output}"; then
            echo "it failed for another reason: ${output}" >&2
            exit 1
          fi
          echo "${output}"
        env:
          CARINA_DRIVER_CONFIG_FILE: ''

  image:
    runs-on: ubuntu-latest
    env:
      CARINA_IMAGE: carina:ci
      CARINA_DRIVER_CONFIG_FILE: ./docker/driver.development.json
      CARINA_STOP_GRACE: 7h
      POSTGRES_PASSWORD: ci-only-not-a-deployment
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t carina:ci .
      - run: docker/verify-image.sh carina:ci
      - run: CARINA_STOP_GRACE="$(docker/grace-period.sh derive)" docker/grace-period.sh check
      - name: A grace period inside the driver's budget is refused, for that reason
        run: |
          if output="$(CARINA_STOP_GRACE=6h docker/grace-period.sh check 2>&1)"; then
            echo "a 6h grace period was accepted against a 6h linger cap" >&2
            echo "${output}" >&2
            exit 1
          fi
          if ! grep -q "does not exceed the driver's own shutdown budget" <<<"${output}"; then
            echo "the check refused it, but not for the reason under test:" >&2
            echo "${output}" >&2
            exit 1
          fi
          echo "${output}"
